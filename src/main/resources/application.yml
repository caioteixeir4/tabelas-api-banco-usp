spring:
  application:
    name: tabelas-api-banco-usp

  # Em desenvolvimento, as credenciais vem de um .env local (gerado por create-api-account.ps1 do
  # repositorio regras-banco-usp, ignorado pelo git). Em qualquer outro lugar, de variaveis de
  # ambiente. O "optional:" faz a aplicacao seguir adiante sem o arquivo.
  config:
    import: optional:file:.env[.properties]

  # DUAS CONTAS DE BANCO, de proposito (ver docs/api-e-regras.md, "Contas de banco"):
  #
  #   * datasource (abaixo): a conta de EXECUCAO, que atende os pedidos. Entra por proxy em
  #     KAWASHI_ENV_<AMBIENTE>_APP, um schema sem objetos que so tem SELECT/INSERT/UPDATE/DELETE
  #     nas tabelas. Nao consegue criar, alterar nem apagar tabela.
  #   * flyway (mais abaixo): a conta de MIGRACAO, que entra como o dono das tabelas. So e usada
  #     na subida da aplicacao.
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      # A conta de execucao entra no schema _APP, que nao tem tabela nenhuma. Toda conexao passa a
      # enxergar as tabelas do schema do ambiente sem precisar do nome dele em cada comando.
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA = ${DB_SCHEMA}

  jpa:
    open-in-view: false
    hibernate:
      # O banco manda: as tabelas nascem das migracoes do Flyway e o Hibernate so confere se as
      # entidades batem com elas. Nunca "update" nem "create".
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}

  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${DB_MIGRACAO_USER}
    password: ${DB_MIGRACAO_PASSWORD}
    # Sem isto o Flyway recusa criar o historico num schema que ja tenha algum objeto.
    baseline-on-migrate: true
    baseline-version: "0"

  mvc:
    # Erros do proprio Spring (404 de rota, 405...) tambem saem no formato RFC 9457, igual aos
    # erros da API (ver TratadorDeErros).
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  # Corpo de requisicao maior que isto e recusado com 413; ver LimiteDeCorpoFilter. O maior corpo
  # legitimo da API tem poucas centenas de bytes.
  limite-corpo-bytes: 65536
  # Com "true", pedido a /api/** que nao chegou por HTTPS e recusado (ver CabecalhosDeSegurancaFilter).
  # Fica desligado so em desenvolvimento e nos testes; fora deles, ligue.
  exigir-https: ${EXIGIR_HTTPS:false}
  # Chaves que cifram os dados pessoais antes de irem para o banco (ver CifraDeDados). Cada uma e
  # 32 bytes em base64. Em desenvolvimento, scripts/gerar-chaves-de-cifra.ps1 as cria no .env; fora
  # dele, vem de variavel de ambiente ou do Vault. Sem elas a aplicacao NAO sobe. Perder a chave de
  # dados e perder os dados cifrados: guarde uma copia fora da maquina.
  cifra:
    chave-dados: ${CIFRA_CHAVE_DADOS:}
    chave-indice: ${CIFRA_CHAVE_INDICE:}

server:
  port: ${PORT:8080}
  # Atras de um proxy reverso que termina o TLS, o cabecalho X-Forwarded-Proto diz se o pedido
  # original era HTTPS.
  forward-headers-strategy: native
  # HTTPS direto na aplicacao: ligue com SSL_ATIVO=true e aponte o keystore (PKCS12).
  ssl:
    enabled: ${SSL_ATIVO:false}
    key-store: ${SSL_KEYSTORE:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12

management:
  endpoints:
    web:
      exposure:
        include: health,info
