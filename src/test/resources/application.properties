# So nos testes. O argon2id de producao (64 MiB, 3 passadas) levaria quase um segundo por hash, e os
# testes criam centenas de usuarios. O HashDeSenha recusa custo baixo sem esta autorizacao explicita,
# entao um erro de configuracao em producao nao enfraquece as senhas em silencio.
app.senha.custo-de-teste=true
app.senha.argon2-memoria-kib=1024
app.senha.argon2-iteracoes=1
app.senha.argon2-paralelismo=1
