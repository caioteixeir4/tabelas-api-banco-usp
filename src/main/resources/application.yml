spring:
  application:
    name: tabelas-api-banco-usp

  # Em desenvolvimento, as credenciais vem de um .env local (gerado por create-api-account.ps1 do
  # repositorio regras-banco-usp, ignorado pelo git). Em qualquer outro lugar, de variaveis de
  # ambiente. O "optional:" faz a aplicacao seguir adiante sem o arquivo.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    # A conta de API entra por proxy no schema do ambiente: CONTA[KAWASHI_ENV_<AMBIENTE>].
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    open-in-view: false
    hibernate:
      # O banco manda: as tabelas nascem das migracoes do Flyway e o Hibernate so confere se as
      # entidades batem com elas. Nunca "update" nem "create".
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Os schemas de ambiente ja nascem com a fixture do repositorio de regras (a tabela CLIENTE),
    # ou seja, NAO estao vazios na primeira execucao. Sem isto o Flyway recusa criar o historico.
    baseline-on-migrate: true
    baseline-version: "0"

  mvc:
    # Erros do proprio Spring (404 de rota, 405...) tambem saem no formato RFC 9457, igual aos
    # erros da API (ver TratadorDeErros).
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
